[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teramont-monitor"
version = "0.2.0"
description = "Evidence-gated universal vehicle search and marketplace monitor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
teramont-monitor = "teramont_monitor.cli:main"
universal-search-worker = "universal_search.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
universal_search = ["static/*.html"]
