[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teramont-monitor"
version = "0.1.0"
description = "Evidence-gated Volkswagen Teramont Pro marketplace monitor"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
teramont-monitor = "teramont_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
