name: Telegram access check (read only)

on:
  push:
    branches: ['diagnostics/telegram-access-42542681766']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify configured bot and chat
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, sys
          from teramont_monitor.telegram_api import check_access, TelegramError
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat = os.environ["TELEGRAM_CHAT_ID"].strip()
          if not token or not chat:
              sys.exit("missing Telegram configuration")
          try:
              check_access(token, chat)
          except TelegramError as error:
              sys.exit(str(error))
          print("Telegram bot and chat access check passed")
          PY
