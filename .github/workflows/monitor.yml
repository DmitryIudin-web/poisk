name: Vehicle marketplace monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teramont-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      PYTHONPATH: src
      STATE_DIR: /tmp/vehicle-monitor-${{ github.run_id }}
      SUMMARY_DIR: /tmp/vehicle-monitor-summaries-${{ github.run_id }}

    steps:
      - name: Check out monitor code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare durable state branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git fetch origin monitor-state:refs/remotes/origin/monitor-state
            git worktree add -B monitor-state "$STATE_DIR" origin/monitor-state
          else
            git worktree add --detach "$STATE_DIR" HEAD
            git -C "$STATE_DIR" switch --orphan monitor-state
          fi
          git -C "$STATE_DIR" config user.name "github-actions[bot]"
          git -C "$STATE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$STATE_DIR/range-rover-d350" "$SUMMARY_DIR"
          touch "$STATE_DIR/history.jsonl" "$STATE_DIR/range-rover-d350/history.jsonl"

      - name: Collect marketplace observations
        id: collect
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m teramont_monitor collect \
            --config config/sources.json \
            --target config/targets/teramont-pro-2026.json \
            --state-dir "$STATE_DIR" | tee "$SUMMARY_DIR/teramont-summary.json"
          teramont_status=${PIPESTATUS[0]}
          python -m teramont_monitor collect \
            --config config/range-rover-sources.json \
            --target config/targets/range-rover-l460-d350-autobiography-2026.json \
            --state-dir "$STATE_DIR/range-rover-d350" | tee "$SUMMARY_DIR/range-rover-summary.json"
          range_rover_status=${PIPESTATUS[0]}
          set -e
          echo "teramont_status=$teramont_status" >> "$GITHUB_OUTPUT"
          echo "range_rover_status=$range_rover_status" >> "$GITHUB_OUTPUT"

      - name: Persist observations and pending events
        shell: bash
        run: |
          set -euo pipefail
          git -C "$STATE_DIR" add -A -- .
          if ! git -C "$STATE_DIR" diff --cached --quiet; then
            git -C "$STATE_DIR" commit -m "state: collect $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git -C "$STATE_DIR" push origin HEAD:monitor-state
          fi

      - name: Deliver significant Telegram events
        id: notify
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python -m teramont_monitor notify --state-dir "$STATE_DIR"
          teramont_notify_status=$?
          python -m teramont_monitor notify --state-dir "$STATE_DIR/range-rover-d350"
          range_rover_notify_status=$?
          if [ "${{ steps.collect.outputs.teramont_status }}" = "0" ]; then
            python -m teramont_monitor digest --state-dir "$STATE_DIR"
            teramont_digest_status=$?
          else
            teramont_digest_status=0
          fi
          if [ "${{ steps.collect.outputs.range_rover_status }}" = "0" ]; then
            python -m teramont_monitor digest --state-dir "$STATE_DIR/range-rover-d350"
            range_rover_digest_status=$?
          else
            range_rover_digest_status=0
          fi
          set -e
          echo "teramont_notify_status=$teramont_notify_status" >> "$GITHUB_OUTPUT"
          echo "range_rover_notify_status=$range_rover_notify_status" >> "$GITHUB_OUTPUT"
          echo "teramont_digest_status=$teramont_digest_status" >> "$GITHUB_OUTPUT"
          echo "range_rover_digest_status=$range_rover_digest_status" >> "$GITHUB_OUTPUT"
          if [ "$teramont_notify_status" != "0" ] || [ "$range_rover_notify_status" != "0" ]; then
            exit 1
          fi
          if [ "$teramont_digest_status" != "0" ] || [ "$range_rover_digest_status" != "0" ]; then
            exit 1
          fi

      - name: Persist Telegram delivery state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C "$STATE_DIR" add -A -- .
          if ! git -C "$STATE_DIR" diff --cached --quiet; then
            git -C "$STATE_DIR" commit -m "state: confirm Telegram delivery $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git -C "$STATE_DIR" push origin HEAD:monitor-state
          fi

      - name: Fail after both target collections and delivery persistence
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.collect.outputs.teramont_status }}" != "0" ] || \
             [ "${{ steps.collect.outputs.range_rover_status }}" != "0" ]; then
            exit 2
          fi

      - name: Upload sanitized failure summaries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-monitor-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.SUMMARY_DIR }}/teramont-summary.json
            ${{ env.SUMMARY_DIR }}/range-rover-summary.json
          if-no-files-found: ignore
          retention-days: 14
