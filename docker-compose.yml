services:
  web:
    build: .
    restart: unless-stopped
    environment:
      SEARCH_DB: /data/searches.db
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
      BRIGHTDATA_SERP_ZONE: ${BRIGHTDATA_SERP_ZONE:-serp_api1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_USER_TOKENS_JSON: ${APP_USER_TOKENS_JSON:-}
      APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN:-}
      MAX_ACTIVE_SEARCHES_PER_USER: ${MAX_ACTIVE_SEARCHES_PER_USER:-3}
      SEARCH_TTL_HOURS: ${SEARCH_TTL_HOURS:-24}
      MIN_SEARCH_INTERVAL_MINUTES: ${MIN_SEARCH_INTERVAL_MINUTES:-60}
      SEARCH_RUN_LOCK_MINUTES: ${SEARCH_RUN_LOCK_MINUTES:-60}
      TRUST_PROXY_HEADERS: "1"
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-30}
      CREATE_SEARCH_LIMIT_PER_HOUR: ${CREATE_SEARCH_LIMIT_PER_HOUR:-3}
    volumes:
      - search-data:/data
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: ["python","-m","universal_search.worker","--db","/data/searches.db"]
    environment:
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
      BRIGHTDATA_SERP_ZONE: ${BRIGHTDATA_SERP_ZONE:-serp_api1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_ENABLED: ${OPENAI_VISION_ENABLED:-0}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-5.6-luna}
      OPENAI_VISION_DETAIL: ${OPENAI_VISION_DETAIL:-low}
      OPENAI_VISION_MAX_IMAGES: ${OPENAI_VISION_MAX_IMAGES:-2}
      OPENAI_VISION_MAX_CANDIDATES_PER_RUN: ${OPENAI_VISION_MAX_CANDIDATES_PER_RUN:-2}
      OPENAI_VISION_MIN_CONFIDENCE: ${OPENAI_VISION_MIN_CONFIDENCE:-0.85}
      OPENAI_VISION_MAX_OUTPUT_TOKENS: ${OPENAI_VISION_MAX_OUTPUT_TOKENS:-400}
      OPENAI_VISION_RESERVED_INPUT_TOKENS: ${OPENAI_VISION_RESERVED_INPUT_TOKENS:-3000}
      OPENAI_DAILY_TOKEN_LIMIT: ${OPENAI_DAILY_TOKEN_LIMIT:-50000}
      OPENAI_DAILY_COST_LIMIT_USD: ${OPENAI_DAILY_COST_LIMIT_USD:-0.10}
      OPENAI_INPUT_COST_PER_1M: ${OPENAI_INPUT_COST_PER_1M:-0.20}
      OPENAI_CACHED_INPUT_COST_PER_1M: ${OPENAI_CACHED_INPUT_COST_PER_1M:-0.02}
      OPENAI_OUTPUT_COST_PER_1M: ${OPENAI_OUTPUT_COST_PER_1M:-1.20}
      SEARCH_TTL_HOURS: ${SEARCH_TTL_HOURS:-24}
      MIN_SEARCH_INTERVAL_MINUTES: ${MIN_SEARCH_INTERVAL_MINUTES:-60}
      SEARCH_RUN_LOCK_MINUTES: ${SEARCH_RUN_LOCK_MINUTES:-60}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - search-data:/data
    depends_on:
      - web

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  search-data:
  caddy-data:
  caddy-config:
